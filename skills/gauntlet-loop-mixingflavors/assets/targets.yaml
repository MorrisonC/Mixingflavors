# Core Gameplay & UI Roadmap Targets for Gauntlet Loop Evaluation

targets:
  - id: StartScreen_MainMenu
    repo_status: Playtested
    core_script: MainMenu.gd
    scene_hint: "scenes/MainMenu.tscn"
    notes: >
      Main title menu screen styling, button hover scale transitions, and background aesthetic.

  - id: LevelSelect_Menu
    repo_status: Playtested
    core_script: PuzzleSelection.gd
    scene_hint: "scenes/PuzzleSelection.tscn"
    notes: >
      3D/2D puzzle level selection grid, thumbnail preview cards, and progression stars.

  - id: UIPopups_Dialogs
    repo_status: Playtested
    core_script: SettingsPanel.gd
    scene_hint: "scenes/MainMenu.tscn"
    notes: >
      Pause, victory, settings, and exit confirmation modal dialog overlays.

  - id: Picross3D_CoreLoop
    repo_status: Playtested
    core_script: VoxelGrid3D.gd
    scene_hint: "scenes/**/*picross*.tscn"
    notes: >
      3D voxel grid state rendering, chiseling, and marking.

  - id: Picross3D_ChiselJuice
    repo_status: Playtested
    core_script: GridManager.gd
    scene_hint: "scenes/VoxelLogic.tscn"
    notes: >
      Voxel destruction animations, dummy mesh scale-bounce VFX, and audio impact.

  - id: Picross3D_ComboFeedback
    repo_status: Playtested
    core_script: ComboHealMechanic.gd
    scene_hint: "scenes/VoxelLogic.tscn"
    notes: >
      Combo multiplier visual overlays, dynamic health recovery feedback, and hit-stop feel.

  - id: Picross3D_ClueRecalculation
    repo_status: Playtested
    core_script: SolvabilityValidator.gd
    scene_hint: "scripts/GridManager.gd"
    notes: >
      Dynamic clue recalculation on outer exposed faces during block destruction.

  - id: Picross3D_TimeBombMechanic
    repo_status: Playtested
    core_script: TimeBombMechanic.gd
    scene_hint: "scripts/TimeBombMechanic.gd"
    notes: >
      Hazardous time-bomb voxel pulse visual cues and defusal mechanics.
