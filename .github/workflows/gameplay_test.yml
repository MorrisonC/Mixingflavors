name: Gameplay Telemetry & Balance Test

on:
  schedule:
    - cron: '0 0 * * *' # Run nightly
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  telemetry-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Cache Godot Engine
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/godot
          key: ${{ runner.os }}-godot-4.3-stable-bin

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 ~/.local/bin/godot
          chmod +x ~/.local/bin/godot

      - name: Ensure Godot is executable
        run: |
          chmod +x ~/.local/bin/godot
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Import Resources
        run: |
          # First run to import all assets properly
          godot --headless --rendering-driver opengl3 --editor --quit || true

      - name: Run Telemetry Bot Test
        run: |
          godot --headless --rendering-driver opengl3 --script res://tools/telemetry_runner.gd

      - name: Analyze & Auto-Patch Balance
        run: |
          godot --headless --rendering-driver opengl3 --script res://tools/analyze_telemetry.gd

      - name: Upload Telemetry Output
        uses: actions/upload-artifact@v4
        with:
          name: telemetry_output
          path: ~/.local/share/godot/app_userdata/*/telemetry_output.json

      - name: Create Pull Request with Patches
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          title: "Automated Game Balance Patches"
          body: "This PR contains automatically generated balance patches based on headless telemetry runs."
          branch: "auto-balance-patches"
          commit-message: "Apply auto balance patches from telemetry analysis"
