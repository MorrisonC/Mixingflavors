name: Scheduled Automated Telemetry

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-telemetry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Godot Engine
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/godot
          key: ${{ runner.os }}-godot-4.3-stable-bin

      - name: Set up Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 ~/.local/bin/godot
          chmod +x ~/.local/bin/godot

      - name: Ensure Godot is executable
        run: |
          chmod +x ~/.local/bin/godot
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          godot --version

      - name: Initialize Godot Project
        run: godot --headless --rendering-driver opengl3 --editor --quit || true

      - name: Run Telemetry Generation
        run: godot --headless --rendering-driver opengl3 --script res://tools/telemetry_runner.gd

      - name: Run Telemetry Analysis
        run: godot --headless --rendering-driver opengl3 --script res://tools/analyze_telemetry.gd

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add BALANCE_ROADMAP.md Scripts/GameManager.gd Scripts/VoxelGrid3D.gd tools/analyze_telemetry.gd || true
          # Use git status to check if there are changes to commit
          if ! git diff --cached --quiet; then
            git commit -m "Automated telemetry run and balance updates"
            git push
          else
            echo "No changes to commit."
          fi
