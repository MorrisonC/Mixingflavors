name: Scheduled Automated Telemetry

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Godot 4.7.1 and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/godot/export_templates
            ~/.local/bin/godot
          key: ${{ runner.os }}-godot-4.7.1

      - name: Install Godot 4.7.1 and matching templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        env:
          GODOT_VERSION: 4.7.1
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/.local/bin/godot"
          chmod +x "$HOME/.local/bin/godot"

          template_root="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_root"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d "$template_root"
          mv "$template_root/templates/"* "$template_root/"
          rmdir "$template_root/templates"

      - name: Put Godot on PATH and verify version
        run: |
          set -euo pipefail
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          chmod +x "$HOME/.local/bin/godot"
          "$HOME/.local/bin/godot" --version
          "$HOME/.local/bin/godot" --version | grep -Eq '^4\.7\.1(\.|$)'

      - name: Import project resources
        run: godot --headless --rendering-driver opengl3 --path "$GITHUB_WORKSPACE" --import

      - name: Run Telemetry Generation
        run: godot --headless --rendering-driver opengl3 --path "$GITHUB_WORKSPACE" --script res://tools/telemetry_runner.gd

      - name: Run Telemetry Analysis
        run: godot --headless --rendering-driver opengl3 --path "$GITHUB_WORKSPACE" --script res://tools/analyze_telemetry.gd

      - name: Commit and Push Changes
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add BALANCE_ROADMAP.md scripts/GameManager.gd scripts/GridManager.gd tools/analyze_telemetry.gd
          if ! git diff --cached --quiet; then
            git commit -m "Automated telemetry run and balance updates"
            git push
          else
            echo "No changes to commit."
          fi
