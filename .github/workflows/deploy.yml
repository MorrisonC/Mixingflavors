name: Build and Upload Artifacts

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Godot 4.7.1 and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/godot/export_templates
            ~/.local/bin/godot
          key: ${{ runner.os }}-godot-4.7.1

      - name: Install Godot 4.7.1 and matching templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        env:
          GODOT_VERSION: 4.7.1
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/.local/bin/godot"
          chmod +x "$HOME/.local/bin/godot"

          template_root="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_root"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d "$template_root"
          mv "$template_root/templates/"* "$template_root/"
          rmdir "$template_root/templates"

      - name: Put Godot on PATH and verify version
        run: |
          set -euo pipefail
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          chmod +x "$HOME/.local/bin/godot"
          "$HOME/.local/bin/godot" --version
          "$HOME/.local/bin/godot" --version | grep -Eq '^4\.7\.1(\.|$)'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build and verify fresh Web release
        run: npm run build:web

      - name: Build Android release
        run: |
          set -euo pipefail
          mkdir -p build/android
          rm -f build/android/MixingFlavorsVoxelGauntlet.apk
          godot --headless --rendering-driver opengl3 --path "$GITHUB_WORKSPACE" --export-release Android build/android/MixingFlavorsVoxelGauntlet.apk
          test -s build/android/MixingFlavorsVoxelGauntlet.apk

      - name: Upload Web Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Web-Release
          path: build/web

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build/android/MixingFlavorsVoxelGauntlet.apk
