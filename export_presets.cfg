[preset.1]
name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="test/**,tests/**,addons/gut/**,tools/**,scripts/test_bridge.gd,node_modules/**,test-results/**,playwright-report/**,build/**,build_manifest.json,assets/puzzles/*_puzzles.json,assets/puzzles/puzzle_manifest.json,package.json,package-lock.json"
export_path="build/android/MixingFlavorsVoxelGauntlet.aab"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]
custom_template/debug=""
custom_template/release=""
; Play requires a 64-bit ABI, so arm64-v8a is the one architecture that must ship.
; armeabi-v7a stays for older phones. x86/x86_64 are deliberately off: they are only
; re-enabled for a local emulator lane, never for an upload.
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
; Godot refuses to produce an .aab unless the Gradle build is enabled, because the
; bundle format needs the Android Gradle Plugin to emit the base module plus the
; per-ABI splits. That in turn is why a JDK, the Android SDK and a warm Gradle
; cache are required for an Android build but not for the Web one.
gradle_build/use_gradle_build=true
gradle_build/gradle_build_directory="res://android"
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=1
gradle_build/min_sdk="24"
gradle_build/target_sdk="36"
gradle_build/custom_theme_attributes={}
keystore/debug="res://debug.keystore"
keystore/debug_user="androiddebugkey"
keystore/debug_password="android"
; Release signing is intentionally blank in version control. `npm run build:android`
; injects the upload keystore from protected environment variables (or the local
; C:\secure info file) into a temporary copy of this preset and restores it
; afterwards, so the upload key password can never reach the repository.
keystore/release=""
keystore/release_user=""
keystore/release_password=""
version/code=1
version/name="0.1.0"
package/name="Mixing Flavors: Voxel Gauntlet"
package/unique_name="com.morrisonc.mixingflavors.voxelgauntlet"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=true
launcher_icons/main_192x192="res://assets/branding/launcher/launcher_192.png"
launcher_icons/adaptive_foreground_432x432="res://assets/branding/launcher/adaptive_foreground_432.png"
launcher_icons/adaptive_background_432x432="res://assets/branding/launcher/adaptive_background_432.png"
launcher_icons/adaptive_monochrome_432x432="res://assets/branding/launcher/adaptive_monochrome_432.png"
graphics/opengl_debug=false
shader_baker/enabled=false
xr_features/xr_mode=0
gesture/swipe_to_dismiss=false
screen/immersive_mode=true
; Edge to edge is mandatory from targetSdk 35 onward. Without it Android letterboxes
; the game and the safe-area handling in MainMenu and TutorialUI has nothing real
; to work against.
screen/edge_to_edge=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
screen/background_color=Color(0.055, 0.043, 0.145, 1)
splash_screen/disable_godot_boot_splash=false
splash_screen/icon="res://assets/branding/launcher/launcher_192.png"
splash_screen/branding_image=""
splash_screen/background_color=Color(0.055, 0.043, 0.145, 1)
; Saves are a local transactional profile. Android auto-backup restoring a stale
; copy onto a new device was already ruled out as a regression class, so keep it off.
user_data_backup/allow=false
command_line/extra_args=""
; Haptics are a shipped feature behind a settings toggle, and Android needs VIBRATE
; for Input.vibrate_handheld to do anything. INTERNET is added by Godot on its own,
; but only when the project actually uses a network feature, so it stays off here.
permissions/custom_permissions=PackedStringArray()
permissions/access_checkin_properties=false
permissions/access_coarse_location=false
permissions/access_fine_location=false
permissions/access_network_state=false
permissions/access_surface_flinger=false
permissions/access_wifi_state=false
permissions/internet=false
permissions/vibrate=true
permissions/wake_lock=false
permissions/write_external_storage=false

